<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双目立体视觉工作台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/workbench.css') }}">
</head>
<body>
    <div class="container-fluid vh-100 d-flex flex-column p-3">
        <header class="text-center mb-3">
            <h1 class="h3">双目立体视觉工作台</h1>
        </header>
        <div class="row flex-grow-1 g-3">
            <div class="col-lg-3 d-flex flex-column">
                <div class="card h-100 shadow-sm">
                    <div class="card-header fw-bold">控制面板</div>
                    <div class="card-body overflow-auto">

                        <div id="step-1-upload" class="step-container">
                            <h5 class="step-title"><i class="ri-upload-2-line me-2"></i>阶段一：上传数据</h5>
                            <div class="mb-2">
                                <label for="left-image-input" class="form-label">左相机图像</label>
                                <input class="form-control form-control-sm" type="file" id="left-image-input">
                            </div>
                            <div class="mb-2">
                                <label for="right-image-input" class="form-label">右相机图像</label>
                                <input class="form-control form-control-sm" type="file" id="right-image-input">
                            </div>
                             <div class="mb-3">
                                <label for="params-file-input" class="form-label">标定参数 (.yml)</label>
                                <input class="form-control form-control-sm" type="file" id="params-file-input" accept=".yml,.yaml">
                            </div>
                            <button id="upload-btn" class="btn btn-primary w-100"><i class="ri-play-line me-2"></i>上传并预览</button>
                        </div>

                        <div id="step-2-rectify" class="step-container mt-3 d-none">
                            <h5 class="step-title"><i class="ri-scissors-cut-line me-2"></i>阶段二：立体校正</h5>
                             <p class="form-text small">检查预览区，确认原始图像已加载。</p>
                            <button id="rectify-btn" class="btn btn-primary w-100"><i class="ri-play-line me-2"></i>开始校正</button>
                        </div>

                        <div id="step-3-match" class="step-container mt-3 d-none">
                            <h5 class="step-title"><i class="ri-focus-3-line me-2"></i>阶段三：立体匹配</h5>
                             <p class="form-text small">检查预览区，确认图像已校正对齐。</p>
                            <button id="match-btn" class="btn btn-primary w-100"><i class="ri-play-line me-2"></i>生成/更新视差图</button>
                        </div>

                        <div id="step-4-reconstruct" class="step-container mt-3 d-none">
                            <h5 class="step-title"><i class="ri-cube-3d-line me-2"></i>阶段四：三维重建</h5>
                             <p class="form-text small">对生成的视差图进行三维重建。</p>
                            <button id="reconstruct-btn" class="btn btn-success w-100"><i class="ri-play-line me-2"></i>开始重建</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6 d-flex flex-column">
                 <div class="card h-100 shadow-sm">
                    <div class="card-header fw-bold">图像预览流水线</div>
                    <div class="card-body overflow-auto d-flex flex-column" id="pipeline-area">
                    </div>
                </div>
            </div>

            <div class="col-lg-3 d-flex flex-column">
                 <div class="card h-100 shadow-sm">
                    <div class="card-header fw-bold">参数调整 / 结果信息</div>
                    <div class="card-body overflow-auto" id="params-results-area">
                        <div id="sgbm-params-container" class="d-none">
                            <p class="form-text small">拖动滑块实时调整参数，预览区将自动更新视差图。</p>
                            <div class="mb-3"><label for="numDisparities" class="form-label">视差范围: <span id="numDisparitiesValue">128</span></label><input type="range" class="form-range sgbm-param" id="numDisparities" min="16" max="256" step="16" value="128"></div>
                            <div class="mb-3"><label for="blockSize" class="form-label">块大小: <span id="blockSizeValue">5</span></label><input type="range" class="form-range sgbm-param" id="blockSize" min="3" max="21" step="2" value="5"></div>
                            <div class="mb-3"><label for="uniquenessRatio" class="form-label">唯一性比率: <span id="uniquenessRatioValue">10</span></label><input type="range" class="form-range sgbm-param" id="uniquenessRatio" min="1" max="20" step="1" value="10"></div>
                            <div class="mb-3"><label for="speckleWindowSize" class="form-label">散斑窗口: <span id="speckleWindowSizeValue">100</span></label><input type="range" class="form-range sgbm-param" id="speckleWindowSize" min="0" max="200" step="10" value="100"></div>
                            <div class="mb-3"><label for="speckleRange" class="form-label">散斑范围: <span id="speckleRangeValue">32</span></label><input type="range" class="form-range sgbm-param" id="speckleRange" min="0" max="64" step="1" value="32"></div>
                            <div class="mb-3"><label for="disp12MaxDiff" class="form-label">最大允许差异: <span id="disp12MaxDiffValue">1</span></label><input type="range" class="form-range sgbm-param" id="disp12MaxDiff" min="-1" max="50" step="1" value="1"></div>
                        </div>
                        <div id="results-info-container" class="mt-4">
                            </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/workbench.js') }}"></script>
</body>
</html>
