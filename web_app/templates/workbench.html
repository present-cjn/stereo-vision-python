<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双目立体视觉工作台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入自定义的样式文件 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/workbench.css') }}">
</head>
<body>

    <div class="container-fluid vh-100 d-flex flex-column p-3">
        <!-- 顶部标题栏 -->
        <header class="text-center mb-3">
            <h1 class="h3">双目立体视觉工作台</h1>
        </header>

        <!-- 主工作区 -->
        <div class="row flex-grow-1 g-3">
            <!-- 左侧边栏：控制区 -->
            <div class="col-md-3 d-flex flex-column">
                <div class="card h-100 shadow-sm">
                    <div class="card-header fw-bold">控制面板</div>
                    <div class="card-body overflow-auto">

                        <!-- 阶段一：上传 -->
                        <div id="step-1-upload" class="step-container">
                            <h5 class="step-title">阶段一：上传图像</h5>
                            <div class="mb-3">
                                <label for="left-image-input" class="form-label">左相机图像</label>
                                <input class="form-control form-control-sm" type="file" id="left-image-input">
                            </div>
                            <div class="mb-3">
                                <label for="right-image-input" class="form-label">右相机图像</label>
                                <input class="form-control form-control-sm" type="file" id="right-image-input">
                            </div>
                             <div class="mb-3">
                                <label for="params-file-input" class="form-label">标定参数 (.yml)</label>
                                <input class="form-control form-control-sm" type="file" id="params-file-input" accept=".yml,.yaml">
                            </div>
                            <button id="upload-btn" class="btn btn-primary w-100">上传并预览</button>
                        </div>

                        <!-- 阶段二：立体校正 -->
                        <div id="step-2-rectify" class="step-container mt-4 d-none">
                            <h5 class="step-title">阶段二：立体校正</h5>
                             <p class="form-text">检查下方预览区，确认原始图像已加载。</p>
                            <button id="rectify-btn" class="btn btn-primary w-100">开始校正</button>
                        </div>

                        <!-- 阶段三：立体匹配 -->
                         <div id="step-3-match" class="step-container mt-4 d-none">
                            <h5 class="step-title">阶段三：立体匹配</h5>
                             <p class="form-text">检查下方预览区，确认图像已校正对齐。</p>
                            <button id="match-btn" class="btn btn-primary w-100">生成视差图</button>
                        </div>

                    </div>
                </div>
            </div>

            <!-- 中间主区域：预览区 -->
            <div class="col-md-6 d-flex flex-column">
                 <div class="card h-100 shadow-sm">
                    <div class="card-header fw-bold">图像预览</div>
                    <div class="card-body d-flex justify-content-around align-items-center" id="preview-area">
                        <div class="image-placeholder">左图像预览</div>
                        <div class="image-placeholder">右图像预览</div>
                    </div>
                </div>
            </div>

            <!-- 右侧边栏：参数/结果区 -->
            <div class="col-md-3 d-flex flex-column">
                <div class="card h-100 shadow-sm">
                    <div class="card-header fw-bold">参数调整 / 结果信息</div>
                    <div class="card-body" id="params-results-area">
                        <p class="text-muted">此处将显示SGBM参数滑块或最终结果。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入新的JS文件 -->
    <script src="{{ url_for('static', filename='js/workbench.js') }}"></script>
</body>
</html>
