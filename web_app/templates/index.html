<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双目立体视觉在线工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 960px; }
        .result-container { min-height: 480px; }
        .nav-tabs .nav-link { color: #6c757d; }
        .nav-tabs .nav-link.active { color: #000; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="text-center mb-5">
            <h1 class="display-5">双目立体视觉在线工具</h1>
            <p class="lead">一个集相机标定与三维重建于一体的Web应用。</p>
        </div>

        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="reconstruction-tab" data-bs-toggle="tab" data-bs-target="#reconstruction" type="button" role="tab">三维重建</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="calibration-tab" data-bs-toggle="tab" data-bs-target="#calibration" type="button" role="tab">相机标定</button>
            </li>
        </ul>

        <div class="tab-content card shadow-sm" id="myTabContent">
            <!-- 三维重建面板 -->
            <div class="tab-pane fade show active p-4" id="reconstruction" role="tabpanel">
                <form id="reco-form">
                    <div class="mb-3">
                        <label for="left-image-input" class="form-label fw-bold">第一步：上传左相机图像</label>
                        <input class="form-control" type="file" id="left-image-input" name="left_image" required>
                    </div>
                    <div class="mb-3">
                        <label for="right-image-input" class="form-label fw-bold">第二步：上传右相机图像</label>
                        <input class="form-control" type="file" id="right-image-input" name="right_image" required>
                    </div>
                    <!-- 核心修改：增加标定文件上传 -->
                    <div class="mb-3">
                        <label for="params-file-input" class="form-label fw-bold">第三步：上传标定参数文件 (.yml)</label>
                        <input class="form-control" type="file" id="params-file-input" name="params_file" accept=".yml,.yaml" required>
                        <div class="form-text">请上传您通过本工具“相机标定”功能下载的，或您已有的 `stereo_params.yml` 文件。</div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg mt-3" id="reco-submit-btn">第四步：开始重建</button>
                </form>
            </div>

            <!-- 相机标定面板 (保持不变) -->
            <div class="tab-pane fade p-4" id="calibration" role="tabpanel">
                <form id="calib-form">
                    <div class="mb-3">
                        <label class="form-label fw-bold">第一步：输入标定板参数</label>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <input type="text" class="form-control" id="corners-input" name="corners" placeholder="内角点数, e.g., 11,8" required>
                            </div>
                            <div class="col-md-6">
                                <input type="number" step="0.1" class="form-control" id="size-input" name="size" placeholder="格子边长 (mm), e.g., 12.0" required>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="calib-images-input" class="form-label fw-bold">第二步：上传标定图像对 (可多选)</label>
                        <input class="form-control" type="file" id="calib-images-input" name="calib_images" multiple required>
                        <div class="form-text">请确保左右图像成对出现，并按 `leftPic1.jpg`, `rightPic1.jpg`, `leftPic2.jpg`, `rightPic2.jpg` ... 的顺序命名。</div>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg mt-3" id="calib-submit-btn">开始标定</button>
                </form>
            </div>
        </div>

        <!-- 状态和结果显示区域 (共用) -->
        <div id="status-container" class="mt-4 text-center d-none">
            <p id="status-message" class="lead"></p>
            <div class="progress" style="height: 25px;">
                <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
            </div>
        </div>
        <div id="result-container" class="mt-5 text-center d-none"></div>
        <div id="error-container" class="alert alert-danger mt-4 d-none" role="alert"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
