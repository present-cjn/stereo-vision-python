<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双目立体视觉在线重建</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 960px; }
        .result-container { min-height: 480px; }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="text-center mb-5">
            <h1 class="display-5">双目立体视觉在线重建</h1>
            <p class="lead">请上传一对左右视图的图片，系统将为您生成深度图。</p>
        </div>

        <form id="upload-form" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label for="left-image-input" class="form-label fw-bold">第一步：上传左相机图像</label>
                <input class="form-control" type="file" id="left-image-input" name="left_image" required>
            </div>
            <div class="mb-3">
                <label for="right-image-input" class="form-label fw-bold">第二步：上传右相机图像</label>
                <input class="form-control" type="file" id="right-image-input" name="right_image" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg mt-3" id="submit-btn">
                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                第三步：开始重建
            </button>
        </form>

        <div id="status-container" class="mt-4 text-center d-none">
            <p id="status-message" class="lead"></p>
            <div class="progress" style="height: 25px;">
                <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
            </div>
        </div>

        <div id="result-container" class="mt-5 text-center d-none">
            <h2 class="mb-4">重建结果：深度图</h2>
            <div class="result-container d-flex justify-content-center align-items-center bg-light border rounded">
                <img id="result-image" src="" alt="结果图像" class="img-fluid">
            </div>
        </div>

        <div id="error-container" class="alert alert-danger mt-4 d-none" role="alert">
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
